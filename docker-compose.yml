services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: credos
      POSTGRES_PASSWORD: credos
      POSTGRES_DB: credos
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credos -d credos"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ./apps/api
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://credos:credos@postgres:5432/credos
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-development-secret
    ports: ["3000:3000"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    build: ./apps/web
    ports: ["5173:80"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres-data:
