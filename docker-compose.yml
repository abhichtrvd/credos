services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: credos
      POSTGRES_PASSWORD: credos
      POSTGRES_DB: credos
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credos -d credos"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ./apps/api
    environment:
      PORT: 3000
    ports: ["3000:3000"]
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build: ./apps/web
    ports: ["5173:80"]
    depends_on: [api]
volumes:
  postgres-data:
